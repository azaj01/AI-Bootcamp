[project]
name = "mlexpert_bootcamp"
version = "1.0.0"
description = "AI Engineering Open Bootcamp"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "openai>=2.43.0",
    "pandas>=3.0.6",
    "pdf2image>=1.17.0",
    "pypdfium2>=5.10.1",
    "python-dotenv>=1.2.3",
    "wand>=0.7.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
